<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lauluapuri</title>
    <style>
        :root {
            --primary-color: #d70000;
            --secondary-color: #ff9500;
            --text-color: #1d1d1f;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --border-color: #e5e5e5;
            --meta-color: #0066cc;
            --muted-color: #86868b;
        }

        * { box-sizing: border-box; }
        
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 { font-size: 2.5rem; margin-bottom: 10px; font-weight: 700; }
        .subtitle { color: var(--muted-color); font-size: 1.1rem; }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            min-height: 600px;
        }

        #lyrics-input {
            width: 100%;
            height: 100%;
            min-height: 500px;
            border: none;
            border-right: 1px solid var(--border-color);
            padding: 20px;
            font-size: 1.2rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            font-family: 'Georgia', serif;
        }

        #analysis-output {
            padding: 20px;
            overflow-y: auto;
        }

        .section-container {
            margin-bottom: 40px;
            border-left: 4px solid var(--border-color);
            padding-left: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--border-color);
        }

        .section-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-stats {
            font-size: 0.8rem;
            color: var(--muted-color);
            font-weight: 500;
        }

        .analyzed-line {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .line-meta {
            font-size: 0.8rem;
            color: var(--meta-color);
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rhyme-badge {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            color: white;
            text-align: center;
            line-height: 22px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .line-viz {
            font-family: monospace;
            font-size: 1.4rem;
            letter-spacing: 4px;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .syllable {
            padding: 2px 4px;
            border-radius: 4px;
            border-bottom: 3px solid transparent;
        }

        .syllable.primary {
            background-color: rgba(215, 0, 0, 0.1);
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .syllable.secondary {
            background-color: rgba(255, 149, 0, 0.1);
            color: var(--secondary-color);
            border-bottom-color: var(--secondary-color);
        }

        .syllable.none {
            color: var(--muted-color);
        }

        .line-text {
            font-size: 0.9rem;
            color: var(--muted-color);
            font-style: italic;
        }

        .empty-state {
            color: var(--muted-color);
            text-align: center;
            margin-top: 100px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: var(--muted-color);
            font-size: 0.85rem;
        }

        @media (max-width: 850px) {
            .editor-grid { grid-template-columns: 1fr; }
            #lyrics-input { border-right: none; border-bottom: 1px solid var(--border-color); height: 300px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Lauluapuri</h1>
            <p class="subtitle">Itsenäinen suomenkielinen lyriikka-analyysi</p>
        </header>

        <main class="editor-grid">
            <textarea id="lyrics-input" placeholder="Kirjoita tähän...&#10;&#10;Esim:&#10;# Säkeistö&#10;Kultaista on rannalla&#10;Sulla kaunis kannalla" spellcheck="false"></textarea>
            <div id="analysis-output">
                <div class="empty-state">Aloita kirjoittamalla vasemmalle.</div>
            </div>
        </main>

        <footer>
            <p>Tavut: [!] painollinen, (·) sivupainollinen | — pitkä, ◡ lyhyt</p>
            <p id="version-display" style="opacity: 0.5; margin-top: 10px;"></p>
        </footer>
    </div>

    <script type="module">
        // --- LOGIIKKA ---
        const VOWELS = 'aeiouyäö';
        const DIPHTHONGS = ['ai', 'ei', 'oi', 'ui', 'yi', 'äi', 'öi', 'au', 'eu', 'iu', 'ou', 'ie', 'uo', 'yö', 'ey', 'iy', 'äy', 'öy'];

        const isVowel = (c) => c ? VOWELS.includes(c.toLowerCase()) : false;

        function syllabify(word) {
            if (!word) return [];
            const chars = word.toLowerCase().replace(/[^a-zäö]/g, '').split('');
            const syllables = [];
            let current = '';

            for (let i = 0; i < chars.length; i++) {
                current += chars[i];
                const next = chars[i + 1];
                if (!next) break;

                if (isVowel(chars[i])) {
                    let nextVowelIdx = -1;
                    for (let j = i + 1; j < chars.length; j++) {
                        if (isVowel(chars[j])) { nextVowelIdx = j; break; }
                    }
                    if (nextVowelIdx !== -1 && nextVowelIdx === i + 1) {
                        const pair = chars[i] + chars[nextVowelIdx];
                        if (chars[i] !== chars[nextVowelIdx] && !DIPHTHONGS.includes(pair)) {
                            syllables.push(current);
                            current = '';
                        }
                    }
                } else if (isVowel(next) && current.length > 1) {
                    if (current.split('').some(isVowel)) {
                        const last = current.slice(-1);
                        syllables.push(current.slice(0, -1));
                        current = last;
                    }
                }
            }
            if (current) syllables.push(current);
            return syllables;
        }

        function isLong(syllable) {
            const v = syllable.toLowerCase().split('').filter(isVowel);
            if (v.length === 0) return false;
            return !isVowel(syllable.slice(-1)) || v.length >= 2;
        }

        function getStress(syllables) {
            return syllables.map((_, i) => i === 0 ? 'primary' : (i % 2 === 0 ? 'secondary' : 'none'));
        }

        function getRhymePart(syllable) {
            const idx = syllable.split('').findIndex(isVowel);
            return idx === -1 ? syllable : syllable.slice(idx);
        }

        function getRhymeScore(syls1, syls2) {
            if (!syls1.length || !syls2.length) return 0;
            let score = 0;
            const len = Math.min(syls1.length, syls2.length);
            
            for (let i = 1; i <= len; i++) {
                const s1 = syls1[syls1.length - i];
                const s2 = syls2[syls2.length - i];
                
                if (i < len) {
                    if (s1 === s2) {
                        score++;
                    } else {
                        if (score > 0) return score; 
                        if (i === 1 && getRhymePart(s1) === getRhymePart(s2)) {
                            score++;
                        } else {
                            return 0;
                        }
                    }
                } else {
                    if (getRhymePart(s1) === getRhymePart(s2)) {
                        score++;
                    } else {
                        return score;
                    }
                }
            }
            return score;
        }

        // --- UI ---
        const input = document.getElementById('lyrics-input');
        const output = document.getElementById('analysis-output');
        const colors = ['#FF3B30', '#34C759', '#007AFF', '#5856D6', '#FF9500', '#AF52DE'];

        function update() {
            const lyrics = input.value;
            if (!lyrics.trim()) {
                output.innerHTML = '<div class="empty-state">Aloita kirjoittamalla vasemmalle.</div>';
                return;
            }

            const lines = lyrics.split('\n');
            const sections = [];
            let currentSection = { name: '', lines: [], totalSyllables: 0 };
            
            const rhymeGroups = new Map();
            let nextGroupId = 1;

            lines.forEach((lineText) => {
                const trimmed = lineText.trim();
                
                if (trimmed.startsWith('#')) {
                    if (currentSection.lines.length > 0 || currentSection.name) {
                        sections.push(currentSection);
                    }
                    currentSection = { 
                        name: trimmed.replace(/^#+\s*/, ''), 
                        lines: [], 
                        totalSyllables: 0 
                    };
                    return;
                }

                const words = trimmed.split(/\s+/).filter(Boolean);
                const lastWord = words.length > 0 ? words[words.length - 1].toLowerCase().replace(/[^a-zäö]/gi, '') : '';
                const lineSyllables = [];
                const wordSyllableLists = [];

                words.forEach(word => {
                    const wordSyllables = syllabify(word);
                    wordSyllableLists.push(wordSyllables);
                    const stresses = getStress(wordSyllables);
                    wordSyllables.forEach((s, i) => {
                        lineSyllables.push({ text: s, isLong: isLong(s), stress: stresses[i] });
                    });
                });

                const currentLastSyls = wordSyllableLists[wordSyllableLists.length - 1] || [];
                let group = null;
                let score = 0;

                if (lastWord) {
                    for (const [prevWord, gid] of rhymeGroups.entries()) {
                        const s = getRhymeScore(currentLastSyls, syllabify(prevWord));
                        if (s >= 1) {
                            group = gid;
                            score = s;
                            break;
                        }
                    }
                    
                    if (!group) {
                        for (const s of sections) {
                            for (const l of s.lines) {
                                const sc = l.lastWord ? getRhymeScore(currentLastSyls, l.lastSyllables) : 0;
                                if (sc >= 1) {
                                    group = nextGroupId++;
                                    l.group = group;
                                    l.score = sc;
                                    rhymeGroups.set(l.lastWord, group);
                                    score = sc;
                                    break;
                                }
                            }
                            if (group) break;
                        }
                        if (!group) {
                            for (const l of currentSection.lines) {
                                const sc = l.lastWord ? getRhymeScore(currentLastSyls, l.lastSyllables) : 0;
                                if (sc >= 1) {
                                    group = nextGroupId++;
                                    l.group = group;
                                    l.score = sc;
                                    rhymeGroups.set(l.lastWord, group);
                                    score = sc;
                                    break;
                                }
                            }
                        }
                    }
                    if (group) rhymeGroups.set(lastWord, group);
                }

                const analyzedLine = { 
                    syllables: lineSyllables, 
                    count: lineSyllables.length, 
                    lastWord, 
                    group,
                    score,
                    lastSyllables: currentLastSyls 
                };
                
                if (trimmed || lineText === '') {
                    currentSection.lines.push(analyzedLine);
                    currentSection.totalSyllables += analyzedLine.count;
                }
            });
            sections.push(currentSection);

            output.innerHTML = sections.map(section => `
                <div class="section-container">
                    ${section.name ? `
                        <div class="section-header">
                            <span class="section-name">${section.name}</span>
                            <span class="section-stats">${section.lines.filter(l => l.syllables.length > 0).length} riviä, ${section.totalSyllables} tavua</span>
                        </div>
                    ` : ''}
                    ${section.lines.map(line => {
                        if (line.syllables.length === 0) return '<div style="height:1.2rem"></div>';
                        return `
                        <div class="analyzed-line">
                            <div class="line-meta">
                                <span>${line.count} tavua</span>
                                ${line.group ? `<span class="rhyme-badge" style="background:${colors[(line.group-1)%colors.length]}">${String.fromCharCode(64+(line.group%26))}</span>` : ''}
                            </div>
                            <div class="line-viz">
                                ${line.syllables.map((s, sIdx) => {
                                    const isRhymingSyllable = line.group && sIdx >= line.syllables.length - line.score;
                                    const style = isRhymingSyllable ? `border-bottom: 3px solid ${colors[(line.group-1)%colors.length]}` : '';
                                    return `<span class="syllable ${s.stress}" style="${style}">${s.isLong ? '—' : '◡'}</span>`;
                                }).join('')}
                            </div>
                            <div class="line-text">${line.syllables.map((s, sIdx) => {
                                const isRhymingSyllable = line.group && sIdx >= line.syllables.length - line.score;
                                const color = isRhymingSyllable ? colors[(line.group-1)%colors.length] : 'inherit';
                                const weight = isRhymingSyllable ? 'bold' : 'normal';
                                return `<span style="color:${color}; font-weight:${weight}">${s.text}</span>`;
                            }).join('-')}</div>
                        </div>
                    `}).join('')}
                </div>
            `).join('');
        }

        input.addEventListener('input', update);
        
        fetch('./package.json').then(r => r.json()).then(pkg => {
            document.getElementById('version-display').innerText = 'v' + pkg.version;
        }).catch(() => {});
    </script>
</body>
</html>
